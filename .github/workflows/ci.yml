name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version
      - name: Build
        run: swift build
      - name: Test
        run: swift test
      - name: Build for iOS
        run: xcodebuild build -scheme OnAir -destination 'generic/platform=iOS Simulator' -quiet
      - name: Build example
        run: swift build --package-path Examples/OnAirDemo
